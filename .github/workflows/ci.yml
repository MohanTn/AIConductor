name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git-history label mining and Tier 1 eval need real history

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: install ripgrep
        run: sudo apt-get install -y ripgrep   # the LOW-confidence fallback shells out to rg

      - name: lint
        run: uv run ruff check .

      - name: test
        run: uv run pytest --cov=hybrid_retrieval --cov-report=term-missing

      # Tier 1 regression gate. bench/tier1_eval.py needs a real repo with real history, so CI
      # runs the same arm set over a synthetic repo instead: it proves mining, retrieval, features
      # and metrics still work end to end and that the pipeline still beats a bad ordering.
      # Real quality numbers come from bench/tier1_sessions.py on a machine with session history.
      - name: tier 1 regression gate
        run: uv run pytest tests/test_tier1_ci.py -v

      - name: doctor
        run: uv run hybrid-retrieval doctor
