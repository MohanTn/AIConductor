<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hybrid-retrieval</title>
<style>
  /* Hand-drawn theme. Boxes are outlines only: the border lives on a ::before
     pseudo-element so the SVG turbulence filter wobbles the line without ever
     touching the text inside it. */
  @font-face {
    font-family: 'Patrick Hand';
    src: url('/static/fonts/PatrickHand-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #141414; --ink: #ece7dc; --dim: #948f84; --faint: #4a4740;
    --ok: #7fd98a; --warn: #e5c15c; --bad: #f07a6c;
    --hand: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f7f3e9; --ink: #1f1c16; --dim: #6b655a; --faint: #c3bcae;
    --ok: #2f7d3c; --warn: #9a7413; --bad: #b23a2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 var(--hand); letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
  }
  #defs { position: absolute; width: 0; height: 0; }

  /* -- the wobble ---------------------------------------------------------- */
  .box { position: relative; }
  .box::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid var(--ink); border-radius: 14px; filter: url(#rough1);
  }
  .box.b2::before { filter: url(#rough2); }
  .box.b3::before { filter: url(#rough3); }
  .box.thin::before { border-width: 1.5px; border-color: var(--dim); }

  /* -- header -------------------------------------------------------------- */
  header { display: flex; align-items: center; gap: 18px; padding: 16px 22px; flex-wrap: wrap; }
  .menu-btn {
    display: flex; align-items: center; gap: 9px; background: none; border: 0;
    color: var(--ink); font: inherit; font-size: 20px; cursor: pointer; padding: 4px 2px;
  }
  .menu-btn .bars { font-size: 22px; line-height: 1; }
  .title { padding: 7px 20px; font-size: 21px; }
  .grow { flex: 1; }

  .switch { position: relative; width: 46px; height: 22px; cursor: pointer; border: 0;
            background: none; padding: 0; }
  .switch::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--ink);
                    border-radius: 6px; filter: url(#rough2); }
  .switch .knob { position: absolute; top: 3px; left: 25px; width: 16px; height: 16px;
                  background: var(--ink); border-radius: 3px; transition: left .12s; }
  .switch .lbl { position: absolute; left: 6px; top: 1px; font-size: 11px; color: var(--ink); }
  :root[data-theme="light"] .switch .knob { left: 4px; }
  :root[data-theme="light"] .switch .lbl { left: auto; right: 5px; }

  .pickbox { position: relative; display: inline-block; }
  .pickbox::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--ink);
                     border-radius: 12px; filter: url(#rough3); pointer-events: none; }
  select, input, textarea, button.plain {
    appearance: none; background: none; border: 0; color: inherit; font: inherit;
    padding: 7px 14px; outline: none;
  }
  select { padding-right: 30px; }
  .pickbox::after { content: '\25BE'; position: absolute; right: 12px; top: 50%;
                    transform: translateY(-50%); pointer-events: none; font-size: 12px; }
  option { background: var(--bg); color: var(--ink); }

  /* -- drawer -------------------------------------------------------------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 8; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 230px; z-index: 9;
            background: var(--bg); padding: 20px 16px; }
  .drawer::before { content: ''; position: absolute; inset: 4px; border: 2px solid var(--ink);
                    border-radius: 14px; filter: url(#rough1); pointer-events: none; }
  .drawer h3 { margin: 4px 6px 14px; font-size: 20px; font-weight: 400; }
  .drawer button { display: block; width: 100%; text-align: left; background: none; border: 0;
                   color: var(--dim); font: inherit; font-size: 18px; padding: 9px 10px;
                   cursor: pointer; border-radius: 8px; }
  .drawer button:hover { color: var(--ink); }
  .drawer button.on { color: var(--ink); }
  .drawer button.on::before { content: '\2013\00a0'; }

  /* -- panels -------------------------------------------------------------- */
  main { padding: 6px 22px 40px; max-width: 1060px; margin: 0 auto; }
  .panel { padding: 18px 20px 20px; margin-bottom: 22px; }
  .panel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .panel-head h2 { margin: 0; font-size: 21px; font-weight: 400; }
  .chip { padding: 5px 16px; font-size: 16px; }
  .kebab { background: none; border: 0; color: var(--dim); font-size: 20px; cursor: pointer;
           line-height: 1; padding: 2px 6px; }
  .kebab:hover { color: var(--ink); }

  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .stat { padding: 12px 14px 14px; min-height: 108px; }
  .stat .k { font-size: 19px; }
  .stat .v { font-size: 25px; margin: 1px 0 6px; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12.5px; line-height: 1.35; color: var(--dim); font-family: var(--hand); }
  .panel-foot { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn { padding: 6px 16px; font: inherit; color: inherit; background: none; border: 0;
         cursor: pointer; }
  .btn[disabled] { color: var(--dim); cursor: default; }

  /* -- session rows -------------------------------------------------------- */
  .srow { padding: 12px 16px; margin-bottom: 14px; cursor: pointer; position: relative; }
  .srow .t { font-size: 18px; }
  .srow .p { color: var(--dim); font-size: 15px; margin-left: 22px; margin-top: 2px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .chev { position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
                font-size: 34px; line-height: 1; color: var(--ink); transition: transform .12s; }
  .srow.open .chev { transform: translateY(-50%) rotate(90deg); }
  .srow .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .sbody { margin: -6px 0 16px; padding: 0 8px; }

  .pager { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .pager .nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .pager .nav button { background: none; border: 0; color: var(--ink); font: inherit;
                       font-size: 19px; cursor: pointer; padding: 2px 8px; }
  .pager .nav button[disabled] { color: var(--faint); cursor: default; }
  .pager .cur { min-width: 26px; text-align: center; }

  /* -- shared bits --------------------------------------------------------- */
  .pill { display: inline-block; padding: 1px 11px; font-size: 14px; position: relative;
          color: var(--dim); }
  .pill::before { content: ''; position: absolute; inset: 0; border: 1.5px solid currentColor;
                  border-radius: 999px; filter: url(#rough2); }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--dim); }
  .err { color: var(--bad); }
  .lbl { color: var(--dim); font-size: 14px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1.5px dashed var(--faint);
           vertical-align: top; }
  th { color: var(--dim); font-weight: 400; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  textarea { width: 100%; min-height: 74px; font-family: var(--hand); font-size: 17px; }
  .flow { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }
  .stage { flex: 0 0 158px; padding: 10px 12px; opacity: .4; }
  .stage.ran { opacity: 1; }
  .stage.skipped { opacity: 1; }
  .stage.skipped::before { border-color: var(--warn); }
  .stage .n { font-size: 16px; }
  .stage .ms { float: right; color: var(--dim); font-size: 13px; }
  .stage .d { color: var(--dim); font-size: 13px; margin-top: 6px; word-break: break-word; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .files { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .f { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px;
       border: 1px solid var(--faint); color: var(--dim); }
  .f.used { color: var(--ok); border-color: var(--ok); }
  .f.wasted { opacity: .6; text-decoration: line-through; }
  .f.extra { color: var(--warn); border-color: var(--warn); }
  .turn { padding: 12px 4px; border-top: 1.5px dashed var(--faint); }
  .cfg { display: grid; grid-template-columns: 240px 170px 1fr; gap: 10px 14px; align-items: center; }
  .cfg .name { font-family: var(--mono); font-size: 12px; }
  .cfg .help { color: var(--dim); font-size: 14px; }
  .cfg .fld { position: relative; }
  .cfg .fld::before { content: ''; position: absolute; inset: 0; border: 1.5px solid var(--faint);
                      border-radius: 10px; filter: url(#rough3); pointer-events: none; }
  .cfg .fld input[type=checkbox] { appearance: auto; margin: 8px 12px; }
  .cfg .fld.changed::before { border-color: var(--warn); }
</style>
</head>
<body>
<svg id="defs" aria-hidden="true">
  <filter id="rough1" x="-4%" y="-8%" width="108%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2" x="-4%" y="-8%" width="108%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.034" numOctaves="2" seed="17" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough3" x="-4%" y="-8%" width="108%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <button class="menu-btn" id="menuBtn"><span class="bars">&#9776;</span> Menu</button>
  <span class="box title">hybrid&#8209;retrieval</span>
  <button class="switch" id="theme" title="light / dark">
    <span class="lbl">on</span><span class="knob"></span>
  </button>
  <span class="grow"></span>
  <span class="pill" id="daemon">daemon ?</span>
  <span class="pickbox"><select id="repo"></select></span>
</header>

<main>
  <section id="view"></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'on') Object.assign(n, v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};
const num = (n) => (n ?? 0).toLocaleString();
const state = {
  repo: null, view: 'home', config: null, dirty: {},
  page: 1, pageSize: Number(localStorage.getItem('pageSize')) || 50, sessions: null,
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({ error: 'bad response' }));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
const q = (extra) => '?repo=' + encodeURIComponent(state.repo) + (extra || '');
const box = (cls, ...kids) => el('div', { class: 'box ' + cls }, ...kids);
const loading = (what) => el('p', { class: 'muted' }, what);

// A pseudo-element border is painted from a filter, so it does not reflow with
// the text. Nothing to recompute on resize, but the seed rotation keeps
// neighbouring boxes from looking stamped out of the same mould.
const seeded = (i) => 'box ' + ['', 'b2', 'b3'][i % 3];

// -- theme ------------------------------------------------------------------
function applyTheme(mode) {
  document.documentElement.dataset.theme = mode;
  localStorage.setItem('theme', mode);
}
applyTheme(localStorage.getItem('theme') || 'dark');
$('#theme').onclick = () =>
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// -- drawer -----------------------------------------------------------------
const VIEWS = [
  ['home', 'Overview'], ['probe', 'Pipeline'], ['traces', 'Traces'], ['config', 'Config'],
];
$('#menuBtn').onclick = () => {
  const close = () => { scrim.remove(); drawer.remove(); };
  const scrim = el('div', { class: 'scrim', on: { onclick: close } });
  const drawer = el('aside', { class: 'drawer' },
    el('h3', {}, 'Menu'),
    VIEWS.map(([id, label]) => el('button', {
      class: state.view === id ? 'on' : '',
      on: { onclick: () => { close(); state.view = id; render(); } },
    }, label)));
  document.body.append(scrim, drawer);
};

// -- home: vector db + sessions ---------------------------------------------
function render() {
  if (!state.repo) return;
  ({ home: renderHome, probe: renderProbe, traces: renderTraces, config: renderConfig }[state.view])();
}

async function renderHome() {
  const view = $('#view');
  const vector = box('panel', loading('Reading the index...'));
  const sessions = box('panel b2', loading('Reconciling traces against session history...'));
  view.replaceChildren(vector, sessions);
  loadVector(vector);
  loadSessions(sessions, { refresh: true });
}

async function loadVector(panel) {
  try {
    const s = await api('/api/status' + q());
    const densePct = s.files ? Math.round((s.dense_ready / s.files) * 100) : 0;
    const langs = s.by_lang.map(l => l.lang + ' ' + l.files).join(', ');
    const model = s.embedder ? s.embedder.model.split('/').pop() : 'no embeddings';
    const stats = [
      ['Files', num(s.files), langs],
      ['Chunks', num(s.chunks), num(s.symbols) + ' symbols'],
      ['Import edges', num(s.edges), num(s.imports) + ' raw refs'],
      ['Dense ready', densePct + '%', s.embedder ? s.embedder.dim + ' dimensions' : 'run embed'],
      ['Traces', num(s.traces), 'index ' + (s.db_bytes / 1e6).toFixed(1) + ' MB'],
      ['Reranker', s.ranker ? num(s.ranker.n_queries) + ' q' : 'none',
        s.ranker ? 'trained ' + s.ranker.trained_on : 'run train-sessions'],
    ];
    const detail = el('div', { hidden: 'hidden' },
      el('p', { class: 'muted', style: 'margin:14px 0 0' },
        'schema v' + s.schema_version + ' · ' + s.repo),
      s.ranker ? metricsTable(s.ranker.metrics) : null);
    const kebab = el('button', { class: 'kebab', title: 'details',
      on: { onclick: () => { detail.hidden = !detail.hidden; } } }, '⋮');

    panel.replaceChildren(
      el('div', { class: 'panel-head' },
        el('h2', {}, 'Vector_DB'),
        box('chip b3', model),
        el('span', { class: 'grow' }), kebab),
      el('div', { class: 'cards' },
        stats.map(([k, v, sub], i) => box(seeded(i) + ' stat',
          el('div', { class: 'k' }, k), el('div', { class: 'v' }, v),
          el('div', { class: 's' }, sub)))),
      detail,
      el('div', { class: 'panel-foot' }, deleteButton(s.repo)));
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

// There is no delete endpoint, and inventing one that removes an index over
// HTTP is not something an unauthenticated localhost server should offer.
// The button says exactly what to run instead.
function deleteButton(repo) {
  const note = el('span', { class: 'muted', hidden: 'hidden', style: 'font-size:14px' });
  const btn = box('thin', el('button', { class: 'btn', on: { onclick: () => {
    note.hidden = false;
    note.replaceChildren(el('span', {}, 'delete the index with '),
      el('code', {}, 'rm -rf ' + repo + '/.hybrid-retrieval'));
  } } }, '✕ Delete'));
  return el('div', { class: 'row', style: 'margin-left:auto' }, note, btn);
}

function metricsTable(metrics) {
  if (!metrics || !metrics.trained) return el('p', { class: 'muted' }, 'no held-out metrics recorded');
  const keys = Object.keys(metrics.trained).filter(k => k !== 'queries');
  return el('table', { style: 'margin-top:10px' },
    el('tr', {}, el('th', {}, 'metric'), el('th', {}, 'fused'), el('th', {}, 'reranked'), el('th', {}, 'delta')),
    keys.map(k => {
      const b = metrics.baseline?.[k] ?? 0, t = metrics.trained[k] ?? 0;
      return el('tr', {}, el('td', {}, k), el('td', { class: 'num' }, b.toFixed(3)),
        el('td', { class: 'num' }, t.toFixed(3)),
        el('td', { class: 'num' }, (t - b >= 0 ? '+' : '') + (t - b).toFixed(3)));
    }));
}

async function loadSessions(panel, { refresh }) {
  try {
    const r = await api('/api/sessions' + q(
      '&limit=200&page=' + state.page + '&page_size=' + state.pageSize +
      '&refresh=' + (refresh ? '1' : '0')));
    state.sessions = r;
    const t = r.totals;
    const head = el('div', { class: 'panel-head' },
      el('h2', {}, 'Sessions'),
      el('span', { class: 'pill' }, num(t.prompts) + ' prompts'),
      el('span', { class: 'pill ' + (t.precision >= .5 ? 'ok' : 'warn') },
        'precision ' + (t.precision * 100).toFixed(0) + '%'),
      el('span', { class: 'pill' }, 'hit rate ' + (t.hit_rate * 100).toFixed(0) + '%'),
      el('span', { class: 'pill ' + (t.extra_files > t.used_files ? 'warn' : '') },
        num(t.extra_files) + ' read anyway'),
      el('span', { class: 'pill' }, num(t.tokens) + ' tokens'));

    if (!r.total) {
      panel.replaceChildren(head, el('p', { class: 'muted' },
        'No traces yet for this repo. Traces appear once the hook shim routes prompts through the daemon.'));
      return;
    }
    panel.replaceChildren(head,
      el('div', {}, r.sessions.map((s, i) => sessionRow(s, i))),
      pager(r, panel));
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

function sessionRow(s, i) {
  const when = new Date(s.ended * 1000);
  const first = s.outcomes.length ? s.outcomes[s.outcomes.length - 1].prompt : '';
  const body = el('div', { class: 'sbody', hidden: 'hidden' }, s.outcomes.map(turnBlock));
  const row = box(seeded(i) + ' srow',
    el('div', { class: 't' }, 'Session title: ' + s.label + '  ·  ' +
      when.toLocaleDateString() + ' ' + when.toLocaleTimeString()),
    el('div', { class: 'p' }, 'session prompt: ' + (first || 'n/a')),
    el('div', { class: 'meta' },
      el('span', { class: 'pill' }, s.prompts + ' prompts'),
      el('span', { class: 'pill' }, num(s.injected_files) + ' injected'),
      el('span', { class: 'pill ' + (s.extra_files > s.used_files ? 'warn' : 'ok') },
        num(s.extra_files) + ' read anyway'),
      el('span', { class: 'pill' },
        'precision ' + (s.observed ? (s.precision * 100).toFixed(0) + '%' : 'n/a'))),
    el('span', { class: 'chev' }, '›'));
  row.onclick = () => { body.hidden = !body.hidden; row.classList.toggle('open', !body.hidden); };
  return el('div', {}, row, body);
}

const fileChips = (paths, cls) => el('div', { class: 'files' },
  paths.length ? paths.map(p => el('span', { class: 'f ' + cls, title: p }, p))
               : el('span', { class: 'muted', style: 'font-size:13px' }, 'none'));

function turnBlock(o) {
  return el('div', { class: 'turn' },
    el('div', {}, o.prompt.length > 240 ? o.prompt.slice(0, 240) + '…' : o.prompt),
    el('div', { class: 'row', style: 'margin-top:6px' },
      el('span', { class: 'pill ' + (o.skipped ? 'warn' : o.decision === 'HIGH' ? 'ok' : '') },
        o.skipped ? 'skipped: ' + o.skip_reason : (o.decision || 'no gate')),
      el('span', { class: 'pill' }, num(o.injected_tokens) + ' tokens'),
      el('span', { class: 'pill' }, Math.round(o.latency_ms) + ' ms'),
      o.observed
        ? el('span', { class: 'pill ' + (o.hit ? 'ok' : 'bad') }, o.hit ? 'hit' : 'miss')
        : el('span', { class: 'pill' }, 'unobserved')),
    el('div', { class: 'two' },
      el('div', {},
        el('div', { class: 'lbl' }, 'Injected (' + o.injected.length + ')'),
        fileChips(o.used, 'used'),
        o.wasted.length ? fileChips(o.wasted, 'wasted') : null),
      el('div', {},
        el('div', { class: 'lbl' }, 'Read after, not injected (' + o.extra.length + ')'),
        fileChips(o.extra, 'extra'))));
}

function pager(r, panel) {
  // Page changes never re-mine the transcripts: the window was already
  // reconciled on the first load, and a second pass would cost a second a click.
  const go = (page) => { state.page = page; loadSessions(panel, { refresh: false }); };
  const size = el('select', { name: 'page_size' }, [10, 25, 50, 100].map(n =>
    el('option', { value: n, ...(n === state.pageSize ? { selected: 'selected' } : {}) }, n)));
  size.onchange = () => {
    state.pageSize = Number(size.value);
    localStorage.setItem('pageSize', state.pageSize);
    go(1);
  };
  const nav = (label, page, on) =>
    el('button', { ...(on ? {} : { disabled: 'disabled' }), on: { onclick: () => go(page) } }, label);
  return el('div', { class: 'pager' },
    el('span', { class: 'lbl' }, 'Page size:'),
    el('span', { class: 'pickbox' }, size),
    el('span', {}, 'of ' + num(r.total)),
    el('div', { class: 'nav' },
      nav('«', 1, r.page > 1),
      nav('‹', r.page - 1, r.page > 1),
      el('span', { class: 'cur' }, r.page),
      nav('›', r.page + 1, r.page < r.pages),
      nav('»', r.pages, r.page < r.pages)));
}

// -- pipeline probe ---------------------------------------------------------
function renderProbe() {
  const out = el('div');
  const input = el('textarea', { id: 'prompt',
    placeholder: 'Type a prompt to watch it move through the pipeline...' });
  const run = el('button', { class: 'btn' }, 'Run probe');
  run.onclick = async () => {
    run.disabled = true;
    out.replaceChildren(loading('Running through the daemon...'));
    try {
      const r = await api('/api/probe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo: state.repo, prompt: input.value }),
      });
      out.replaceChildren(probeView(r));
    } catch (e) { out.replaceChildren(el('p', { class: 'err' }, e.message)); }
    run.disabled = false;
  };
  $('#view').replaceChildren(box('panel',
    el('div', { class: 'panel-head' }, el('h2', {}, 'Pipeline')),
    el('p', { class: 'muted' },
      'Runs a real request through the daemon, exactly as the hook does, and shows every stage.'),
    box('thin', input),
    el('div', { class: 'row', style: 'margin-top:12px' }, box('thin', run)),
    out));
}

function probeView(r) {
  const skipped = r.trace && r.trace.skipped;
  const flow = el('div', { class: 'flow' }, r.stages.map((s, i) => box(
    seeded(i) + ' stage' + (s.ran ? ' ran' : '') + (s.key === 'skip' && skipped ? ' skipped' : ''),
    el('div', {}, el('span', { class: 'ms' }, s.ms != null ? s.ms + 'ms' : ''),
      el('span', { class: 'n' }, s.label)),
    el('div', { class: 'd' }, s.detail))));

  const sel = (r.trace && r.trace.selected) || [];
  const table = sel.length ? el('table', {},
    el('tr', {}, el('th', {}, '#'), el('th', {}, 'file'), el('th', {}, 'model'),
      el('th', {}, 'rrf'), el('th', {}, 'dense'), el('th', {}, 'sparse'), el('th', {}, 'hops')),
    sel.map((c, i) => el('tr', {}, el('td', { class: 'num' }, i + 1),
      el('td', { class: 'mono' }, c.path),
      el('td', { class: 'num' }, c.model_score), el('td', { class: 'num' }, c.rrf),
      el('td', { class: 'num' }, c.dense_rank ?? '-'), el('td', { class: 'num' }, c.sparse_rank ?? '-'),
      el('td', { class: 'num' }, c.ast_hops ?? '-'))))
    : el('p', { class: 'muted' }, 'Nothing injected.');

  const resp = r.response || {};
  const tokens = resp.tokens || 0;
  return el('div', {},
    el('h2', { style: 'font-weight:400;font-size:19px' }, 'Stages'), flow,
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('span', { class: 'pill ' + (skipped ? 'warn' : 'ok') }, skipped ? 'skipped' : 'injected'),
      el('span', { class: 'pill' }, (resp.latency_ms ?? 0) + ' ms'),
      el('span', { class: 'pill ' + (tokens > 10000 ? 'bad' : '') }, num(tokens) + ' tokens'),
      tokens > 10000 ? el('span', { class: 'muted' },
        'above ~10k the harness may spill hook output to a file instead of inlining it') : null),
    el('h2', { style: 'font-weight:400;font-size:19px' }, 'Selected files'), table);
}

// -- traces -----------------------------------------------------------------
async function renderTraces() {
  const panel = box('panel', loading('Loading...'));
  $('#view').replaceChildren(panel);
  try {
    const { traces } = await api('/api/traces' + q('&limit=40'));
    const head = el('div', { class: 'panel-head' }, el('h2', {}, 'Traces'));
    if (!traces.length) {
      panel.replaceChildren(head, el('p', { class: 'muted' },
        'No traces yet. Every hook request writes one, including skipped prompts.'));
      return;
    }
    panel.replaceChildren(head, el('table', {},
      el('tr', {}, el('th', {}, 'when'), el('th', {}, 'prompt'), el('th', {}, 'outcome'),
        el('th', {}, 'ms'), el('th', {}, 'tokens'), el('th', {}, 'files')),
      traces.map(t => el('tr', {},
        el('td', { class: 'mono' }, new Date(t.ts * 1000).toLocaleTimeString()),
        el('td', {}, t.prompt.slice(0, 90)),
        el('td', {}, el('span', { class: 'pill ' + (t.skipped ? 'warn' : t.decision === 'HIGH' ? 'ok' : '') },
          t.skipped ? 'skipped' : (t.decision || 'no gate'))),
        el('td', { class: 'num' }, Math.round(t.latency_ms)),
        el('td', { class: 'num' }, num(t.injected_tokens)),
        el('td', { class: 'mono' },
          (t.selected || []).map(s => s.path.split('/').pop()).join(', ') || (t.skip_reason || ''))))));
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

// -- config -----------------------------------------------------------------
const HELP = {
  top_n: 'How many files to inject.',
  max_tokens: 'Injection budget. Empty means uncapped. Note a single large file is always admitted whole.',
  latency_budget_ms: 'Target end-to-end budget for the hook.',
  'retrieval.dense_k': 'Vector candidates before fusion.',
  'retrieval.sparse_k': 'BM25 candidates before fusion.',
  'retrieval.fuse_to': 'Candidates kept after RRF, and the reranker input size.',
  'retrieval.rrf_k': 'RRF damping constant.',
  'retrieval.ast_depth': 'Import-graph expansion. Measured as harmful; 0 disables it.',
  'retrieval.rescore_k': 'int8 hits rescored at full precision.',
  'skip.min_prompt_chars': 'Floor for degenerate input.',
  'skip.min_query_terms': 'Usable search terms required to bother retrieving.',
  'index.debounce_ms': 'Quiet period before reindexing after a file change.',
  'index.max_file_bytes': 'Files larger than this are never indexed.',
  'embed.model_id': 'Embedding model. Changing it requires embed --reset.',
  'embed.batch_size': 'Larger is not faster on a small GPU.',
  'embed.min_chunk_tokens': 'Chunks below this skip the dense pass but stay searchable.',
};
const SKIP_KEYS = new Set(['socket', 'skip.patterns', 'embed.device', 'gate.mode']);

async function renderConfig() {
  const panel = box('panel', loading('Loading...'));
  $('#view').replaceChildren(panel);
  try {
    const cfg = await api('/api/config' + q());
    state.config = cfg; state.dirty = {};
    const rows = [];
    const walk = (obj, defaults, prefix) => {
      for (const [k, v] of Object.entries(obj)) {
        const path = prefix ? prefix + '.' + k : k;
        if (v && typeof v === 'object' && !Array.isArray(v)) { walk(v, defaults[k] || {}, path); continue; }
        if (SKIP_KEYS.has(path) || Array.isArray(v)) continue;
        rows.push(field(path, v, defaults[k]));
      }
    };
    walk(cfg.effective, cfg.defaults, '');
    const save = el('button', { class: 'btn' }, 'Save to repo config');
    save.onclick = () => saveConfig(cfg, 'repo');
    const saveGlobal = el('button', { class: 'btn' }, 'Save globally');
    saveGlobal.onclick = () => saveConfig(cfg, 'global');
    panel.replaceChildren(
      el('div', { class: 'panel-head' }, el('h2', {}, 'Config')),
      el('p', { class: 'muted' }, 'Repo file: ' + (cfg.repo_file || 'n/a') +
        ' — only values that differ from the defaults are written.'),
      el('div', { class: 'cfg' }, rows),
      el('div', { class: 'row', style: 'margin-top:18px' },
        box('thin', save), box('thin b2', saveGlobal),
        el('span', { id: 'cfgMsg', class: 'muted' })));
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

function field(path, value, dflt) {
  const isBool = typeof value === 'boolean';
  const input = el('input', isBool
    ? { type: 'checkbox', name: path, ...(value ? { checked: 'checked' } : {}) }
    : { type: typeof value === 'number' ? 'number' : 'text', name: path,
        value: value ?? '', step: 'any' });
  const wrap = el('div', { class: 'fld' }, input);
  input.oninput = () => {
    const raw = isBool ? input.checked : input.value;
    let parsed = raw;
    if (!isBool && typeof value === 'number') parsed = raw === '' ? null : Number(raw);
    if (!isBool && value === null && raw === '') parsed = null;
    state.dirty[path] = parsed;
    wrap.classList.toggle('changed', String(raw) !== String(value ?? ''));
  };
  return [el('div', { class: 'name' }, path), wrap,
    el('div', { class: 'help' },
      (HELP[path] || '') + (dflt !== undefined ? ' (default ' + JSON.stringify(dflt) + ')' : ''))];
}

async function saveConfig(cfg, scope) {
  const msg = $('#cfgMsg');
  const updates = {};
  for (const [path, value] of Object.entries(state.dirty)) {
    const parts = path.split('.');
    let node = updates;
    while (parts.length > 1) node = node[parts.shift()] ??= {};
    node[parts[0]] = value;
  }
  if (!Object.keys(updates).length) { msg.textContent = 'nothing changed'; return; }
  try {
    const r = await api('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo: state.repo, updates, scope }),
    });
    msg.textContent = 'saved to ' + r.written + ' — restart the daemon to apply';
    renderConfig();
  } catch (e) { msg.textContent = e.message; msg.className = 'err'; }
}

// -- boot -------------------------------------------------------------------
async function boot() {
  const health = await api('/api/health').catch(() => ({ running: false }));
  const pill = $('#daemon');
  pill.textContent = health.running
    ? 'daemon up' + (health.embedder ? ' · ' + health.embedder.split('/').pop() : '')
    : 'daemon down';
  pill.className = 'pill ' + (health.running ? 'ok' : 'bad');

  const { repos } = await api('/api/repos');
  const sel = $('#repo');
  sel.replaceChildren(...repos.map(r => el('option', { value: r.path }, r.name)));
  if (!repos.length) {
    $('#view').replaceChildren(box('panel', el('p', { class: 'muted' }, 'No indexed repos found.')));
    return;
  }
  const saved = localStorage.getItem('repo');
  state.repo = saved && repos.some(r => r.path === saved) ? saved : repos[0].path;
  sel.value = state.repo;
  sel.onchange = () => {
    state.repo = sel.value;
    localStorage.setItem('repo', state.repo);
    state.page = 1;
    render();
  };
  render();
}
boot();
</script>
